name: diag
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "== catalog"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $T" | head -c 700; echo
          echo "== chat"; curl -sS -i -X POST https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}' | head -c 1500; echo
          echo "== org chat"; curl -sS -i -X POST https://models.github.ai/orgs/ciaran-apps/inference/chat/completions -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}' | head -c 1500; echo
          echo "== proxy env"; env | grep -i proxy || echo none
