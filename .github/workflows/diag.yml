name: diag
on: workflow_dispatch
permissions:
  contents: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="Mozilla/5.0 (X11; Linux x86_64) Chrome/130 Safari/537.36"
          echo "== PL api goals arsenal"; curl -sS -m 20 -H "Origin: https://www.premierleague.com" -A "$B" "https://footballapi.pulselive.com/football/stats/ranked/players/goals?page=0&pageSize=12&comps=1&compCodeForActivePlayer=EN_PR&altIds=true&teams=1" | head -c 1500; echo
          echo "== PL api clubs"; curl -sS -m 20 -H "Origin: https://www.premierleague.com" -A "$B" "https://footballapi.pulselive.com/football/teams?pageSize=5&comps=1&altIds=true&page=0" | head -c 600; echo
          echo "== 11v11 apps"; curl -sS -m 20 -A "$B" -o /tmp/a.html -w "%{http_code} %{size_download}\n" "https://www.11v11.com/teams/arsenal/tab/stats/option/appearances/"; sed -n '/<tbody>/,/<\/tbody>/p' /tmp/a.html | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 700; echo
          echo "== 11v11 goals"; curl -sS -m 20 -A "$B" -o /tmp/g.html -w "%{http_code} %{size_download}\n" "https://www.11v11.com/teams/arsenal/tab/stats/option/goals/"; sed -n '/<tbody>/,/<\/tbody>/p' /tmp/g.html | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 700; echo
          echo "== 11v11 links"; grep -o 'href="/teams/arsenal/tab/stats/option/[^"]*"' /tmp/a.html | sort -u | head -20
          echo "== end"
