name: diag
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for u in https://api.github.com/zen https://opentdb.com/api.php?amount=1 https://example.com https://models.github.ai/catalog/models https://api.anthropic.com https://generativelanguage.googleapis.com; do echo "== $u"; curl -sS -o /tmp/b -w "%{http_code} %{content_type} ip=%{remote_ip}\n" "$u"; head -c 120 /tmp/b; echo; done
          echo "== dns"; getent hosts models.github.ai opentdb.com
          echo "== end"
